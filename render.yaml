# ============================================================
# FlyHigh Team Event — Render Blueprint
# ============================================================
# Deploy: Connect your GitHub repo to Render and it will
# auto-detect this file.

services:
  - type: web
    name: flyhigh-auction-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: CORS_ORIGINS
        sync: false  # Set to your Vercel domain
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel domain
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: WEB_CONCURRENCY
        value: 2
